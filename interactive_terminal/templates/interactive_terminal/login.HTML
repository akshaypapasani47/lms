<!DOCTYPE html>
<html>
<head>
    <title>Terminal Login</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:#1e1e1e;
            padding:40px;
            border-radius:10px;
            width:350px;
            text-align:center;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:black;
            color:white;
            border:1px solid #555;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#00aa00;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#00cc00;
        }

        h1{
            margin-bottom:25px;
        }

        .error{
            color:red;
            margin-top:15px;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>Virtual Lab Terminal</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Linux Username"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
