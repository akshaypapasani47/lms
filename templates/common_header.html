{% load static %}

<nav class="hpc-header fixed-top">

    <div class="hpc-header-inner">

        <!-- ==============================================
             LEFT
             ============================================== -->

        <div class="hpc-header-left">

            {% if user.is_authenticated %}

            <button id="sidebar-toggle"
                    type="button"
                    class="hpc-menu-button"
                    onclick="hpcToggleSidebar()"
                    aria-label="Toggle navigation">

                <span></span>
                <span></span>
                <span></span>

            </button>

            {% endif %}


            <!-- Brand -->

            <a href="/" class="hpc-brand">

                <div class="hpc-brand-logos">

                    <div class="hpc-logo-wrap">
                        <img
                            src="{% static 'img/cdac_logo.png' %}"
                            alt="C-DAC">
                    </div>

                    <div class="hpc-logo-divider"></div>

                    <div class="hpc-logo-wrap">
                        <img
                            src="{% static 'img/nsm_logo.png' %}"
                            alt="NSM">
                    </div>

                    <div class="hpc-logo-divider"></div>

                    <div class="hpc-logo-wrap">
                        <img
                            src="{% static 'img/chuk_logo.png' %}"
                            alt="C-HUK">
                    </div>

                </div>


                <div class="hpc-brand-text">

                    <div class="hpc-brand-title">
                        HPC E-Learning Platform
                    </div>

                    <div class="hpc-brand-subtitle">
                        HIGH PERFORMANCE COMPUTING • DIGITAL LEARNING
                    </div>

                </div>

            </a>

        </div>


        <!-- ==============================================
             RIGHT
             ============================================== -->

        <div class="hpc-header-right">


            <!-- System status -->

            <!-- <div class="hpc-system-status">

                <span class="hpc-status-dot"></span>

                <span>
                    SYSTEM ONLINE
                </span>

            </div> -->


            <!-- Theme -->

            <button
                id="theme-toggle"
                type="button"
                class="hpc-theme-button"
                onclick="toggleTheme()"
                aria-label="Switch theme"
                title="Switch theme">

                <i class="fas fa-moon theme-icon"></i>

            </button>


            {% if user.is_authenticated %}

            <!-- Profile -->

            <a
                href="{% url 'profile' %}"
                class="hpc-profile-button">

                <span class="hpc-profile-icon">
                    <i class="fas fa-user"></i>
                </span>

                <span class="hpc-profile-text">
                    Profile
                </span>

            </a>


            <!-- Logout -->

            <a
                href="{% url 'logout' %}"
                class="hpc-logout-button">

                <i class="fas fa-power-off"></i>

                <span>
                    Logout
                </span>

            </a>

            {% else %}

            <!-- Login -->

            <a
                href="{% url 'login' %}"
                class="hpc-login-button">

                <i class="fas fa-arrow-right-to-bracket"></i>

                <span>
                    Login
                </span>

            </a>


            <!-- Register -->

            <a
                href="{% url 'register' %}"
                class="hpc-register-button">

                <span>
                    Register
                </span>

                <i class="fas fa-arrow-right"></i>

            </a>

            {% endif %}

        </div>

    </div>


    <!-- Animated energy line -->

    <div class="hpc-header-energy"></div>

</nav>
