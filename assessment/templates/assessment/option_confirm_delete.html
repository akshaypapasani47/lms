{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <a
        href="{% url 'question_options' question.pk %}"
        class="btn btn-outline-secondary mb-4"
    >
        ← Back to Options
    </a>


    <div class="card shadow-sm">

        <div class="card-body text-center">

            <h3>
                Delete Option?
            </h3>

            <p>
                {{ option.option_text }}
            </p>


            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'question_options' question.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
