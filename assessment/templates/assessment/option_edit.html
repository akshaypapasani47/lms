{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <a
        href="{% url 'question_options' question.pk %}"
        class="btn btn-outline-secondary mb-3"
    >
        ← Back to Options
    </a>


    <div class="card shadow-sm">

        <div class="card-header">
            <strong>
                Edit Option
            </strong>
        </div>


        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% for error in field.errors %}
                            <div class="text-danger">
                                {{ error }}
                            </div>
                        {% endfor %}

                    </div>

                {% endfor %}


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'question_options' question.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
