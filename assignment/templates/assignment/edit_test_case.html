{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2>Edit Test Case</h2>
  <p class="text-muted">Question: {{ test_case.question.question_text|truncatewords:10 }}</p>
  <hr>
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex justify-content-between">
      <a href="{% url 'add_test_case' test_case.question.id %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
