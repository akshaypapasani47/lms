{% extends "base.html" %}

{% block content %}

<h1>{{ lab.title }}</h1>

<p>{{ lab.description }}</p>

<hr>

<!-- COMMAND INPUT -->
<form method="POST">
    {% csrf_token %}

    <input type="text" name="command" placeholder="Enter command" style="width:300px;">
    <button type="submit">Run</button>
</form>

<hr>

<!-- OUTPUT SECTION -->
<h3>Output:</h3>
<pre style="background:#000;color:#0f0;padding:10px;">
{{ output }}
</pre>

{% endblock %}
