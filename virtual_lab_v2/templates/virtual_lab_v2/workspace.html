{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="text-center">

        <h2 class="fw-bold">
            Virtual Lab Workspace
        </h2>

        <p class="text-muted">
            Select the service you want to use
        </p>

    </div>

    <div class="row mt-5 justify-content-center">

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1>🖥</h1>

                    <h4>Terminal</h4>

                    <p>
                        Access your Linux terminal.
                    </p>

                    <a href="{% url 'lab_terminal' %}"
                       class="btn btn-primary">

                        Open Terminal

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1>📁</h1>

                    <h4>File Manager</h4>

                    <p>
                        Manage files and folders.
                    </p>

                    <a href="{% url 'files' %}"
                       class="btn btn-success">

                        Open File Manager

                    </a>

                </div>

            </div>

        </div>


        <div class="text-center mt-4">

            <a href="javascript:history.back()"
            class="btn btn-secondary me-2">

                ⬅ Back

            </a>

            <a href="{% url 'lab_logout' %}"
            class="btn btn-danger">

                🚪 Logout

            </a>

        </div>

    </div>

</div>

{% endblock %}
