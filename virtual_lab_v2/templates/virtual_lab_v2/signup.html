{% extends "base.html" %}

{% block content %}
<h2>Virtual Lab Signup</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Signup
    </button>

</form>

{{ error }}

{% endblock %}
