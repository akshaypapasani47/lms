{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h4 class="mb-0">Create Virtual Lab</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Lab Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter lab name"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Lab Type
                    </label>

                    <select
                        name="lab_type"
                        class="form-select"
                        required>

                        <option value="">
                            Select Lab Type
                        </option>

                        <option value="PROGRAMMING">
                            Programming Lab
                        </option>

                        <option value="AI">
                            AI Lab
                        </option>

                        <option value="BIG_DATA">
                            Big Data Lab
                        </option>

                        <option value="QUANTUM">
                            Quantum Lab
                        </option>

                        <option value="HPC">
                            HPC Lab
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Describe this virtual lab"></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Create Virtual Lab

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
