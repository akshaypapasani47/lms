{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h3>

        Move File To Folder

    </h3>

    <br>

    <form

    method="POST"

    action="{% url 'move_file' file_name %}">

        {% csrf_token %}

        <input

        type="hidden"

        name="current_path"

        value="{{ current_path }}">


        <select

        name="destination_folder"

        class="form-control"

        required>

            {% for folder in folders %}

            <option value="{{ folder }}">

                {{ folder }}

            </option>

            {% endfor %}

        </select>

        <br>

        <button

        type="submit"

        class="btn btn-success">

            Move File

        </button>

    </form>

</div>

{% endblock %}
